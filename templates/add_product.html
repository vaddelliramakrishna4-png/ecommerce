<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - RK Mart Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_product.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <div style="display: flex; align-items: center; gap: 10px; color: #38bdf8;">
                <i class="fa-solid fa-cart-shopping"></i>
                <span style="font-weight: 700; font-size: 20px;">RK Mart Admin</span>
            </div>
            <button id="sidebar-close" style="background: none; border: none; color: #ef4444; font-size: 22px; cursor: pointer; display: none;">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <ul>
            <li class="{% if active == 'dashboard' %}active{% endif %}">
                <a href="{{ url_for('admin_dashboard') }}"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            </li>
            <li class="{% if active == 'add_product' %}active{% endif %}">
                <a href="{{ url_for('add_product') }}"><i class="fa-solid fa-plus"></i> Add Product</a>
            </li>
            <li class="{% if active == 'products' %}active{% endif %}">
                <a href="{{ url_for('admin_products') }}"><i class="fa-solid fa-box"></i> Products</a>
            </li>
            <li class="{% if active == 'orders' %}active{% endif %}">
                <a href="{{ url_for('admin_orders') }}"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
            </li>
            <li class="{% if active == 'customers' %}active{% endif %}">
                <a href="{{ url_for('admin_customers') }}"><i class="fa-solid fa-users"></i> Customers</a>
            </li>
            <li>
                <a href="/home"><i class="fa-solid fa-house"></i> Go to Website</a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="top">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button id="sidebar-toggle" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: none;">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h1>Add New Product</h1>
            </div>
            <button class="profile" onclick="window.location.href='{{ url_for('admin') }}'">Admin</button>
        </div>

        <div class="card">
            <!-- Correct Form with POST and enctype -->
            <form method="POST" action="/add-product" enctype="multipart/form-data">
                
                <div class="row">
                    <div class="input-box">
                        <label>Product Name</label>
                        <input type="text" name="product_name" placeholder="Ex: iPhone 16 Pro" required>
                    </div>
                    <div class="input-box">
                        <label>Brand</label>
                        <input type="text" name="brand" placeholder="Ex: Apple" required>
                    </div>
                </div>

                <div class="row">
                    <div class="input-box">
                        <label>Price (₹)</label>
                        <input type="number" name="price" placeholder="Ex: 99999" required>
                    </div>
                    <div class="input-box">
                        <label>Stock</label>
                        <input type="number" name="stock" placeholder="Ex: 25" required>
                    </div>
                </div>

                <div class="row">
                    <div class="input-box">
                        <label for="category">Product Category</label>
                        <select id="category" name="category" onchange="checkCategory(this)" required>
                            <option value="">-- Select Category --</option>
                            <option value="Mobiles">📱 Mobiles</option>
                            <option value="Laptops">💻 Laptops</option>
                            <option value="Fashion">👗 Fashion</option>
                            <option value="Electronics">🎧 Electronics</option>
                            <option value="Other">➕ Other (Type Manual)</option>
                        </select>
                    </div>
                    <div class="input-box">
                        <label for="display_section">Display Section</label>
                        <select id="display_section" name="display_section" required>
                            <option value="recent">🛍️ Recently Added Products</option>
                            <option value="deals">🔥 Deals of the Day</option>
                            <option value="trending">🚀 Trending Now</option>
                            <option value="new_arrivals">✨ New Arrivals</option>
                        </select>
                    </div>
                </div>

                <!-- Manual Category Box (Hidden initially) -->
                <div class="input-box" id="manual-category-box" style="display: none; margin-top: 10px;">
                    <label for="manual_category">Enter New Category Name</label>
                    <input type="text" id="manual_category" name="manual_category" placeholder="Ex: Home Appliances, Books, Shoes...">
                </div>

                <div class="input-box" style="margin-top: 15px;">
                    <label>Description</label>
                    <textarea name="description" rows="4" placeholder="Enter product description..."></textarea>
                </div>

                <!-- Image Upload Box -->
                <div class="upload" style="margin-top: 20px; border: 2px dashed #38bdf8; border-radius: 12px; padding: 30px; text-align: center; background: rgba(56, 189, 248, 0.03); cursor: pointer; position: relative;">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 40px; color: #38bdf8; margin-bottom: 15px;"></i>
                    <p style="color: #94a3b8; font-weight: 500;">Click here to Upload Product Images (Select 3 or 4 images)</p>
                    <input type="file" name="product_images" id="imageInput" accept="image/*" multiple style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
                    <p style="color: #64748b; font-size: 13px; margin-top: 5px;">You can select multiple files at once</p>
                </div>
                
                <!-- Thumbnails Container -->
                <div id="preview-container" style="display: flex; gap: 15px; flex-wrap: wrap; margin-top: 20px; justify-content: center;">
                </div>

                <!-- Save Button at the VERY BOTTOM -->
                <button type="submit" class="save" style="margin-top: 25px;">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Product
                </button>

            </form>
        </div>
    </div>

<script src="{{ url_for('static', filename='js/add_product.js') }}"></script>
<script>
function checkCategory(selectObject) {
    let manualBox = document.getElementById("manual-category-box");
    let manualInput = document.getElementById("manual_category");

    if (selectObject.value === "Other") {
        manualBox.style.display = "block";
        manualInput.required = true;
    } else {
        manualBox.style.display = "none";
        manualInput.required = false;
        manualInput.value = "";
    }
}
</script>

<script>
    (function() {
        const sidebar = document.querySelector('.sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const closeBtn = document.getElementById('sidebar-close');

        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.add('mobile-show');
            });
        }

        if (closeBtn && sidebar) {
            closeBtn.addEventListener('click', () => {
                sidebar.classList.remove('mobile-show');
            });
        }

        // Close sidebar on background click
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 900) {
                if (sidebar && toggleBtn && !sidebar.contains(e.target) && !toggleBtn.contains(e.target) && sidebar.classList.contains('mobile-show')) {
                    sidebar.classList.remove('mobile-show');
                }
            }
        });
    })();
</script>

</body>
</html>
