<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - RK Mart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Brand Logo / Icon -->
            <div class="brand-icon">
                <i class="fa-solid fa-user-pen" style="color: #f59e0b;"></i>
            </div>
            
            <h2>Edit Profile</h2>
            <p class="subtitle">Update your account name below.</p>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('edit_profile') }}" method="POST">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="name" value="{{ session.get('user_name', '') }}" placeholder="Enter your full name" required autofocus>
                </div>

                <button type="submit" class="signin-btn" style="margin-top: 10px;">Update Name</button>
                <a href="/profile" style="display:block; margin-top:15px; color:#64748b; text-decoration:none; font-size:14px; font-weight:500;"><i class="fa-solid fa-arrow-left"></i> Cancel</a>
            </form>
        </div>
    </div>

</body>
</html>
