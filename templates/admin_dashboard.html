<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK Mart Admin Dashboard</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/admin_dashboard.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="sidebar">
    <div class="logo" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
        <div style="display: flex; align-items: center; gap: 10px; color: #38bdf8;">
            <i class="fa-solid fa-cart-shopping"></i>
            <span style="font-weight: 700; font-size: 20px;">RK Mart Admin</span>
        </div>
        <button id="sidebar-close" style="background: none; border: none; color: #ef4444; font-size: 22px; cursor: pointer; display: none;">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <ul>
        <li class="{% if active == 'dashboard' %}active{% endif %}">
            <a href="{{ url_for('admin_dashboard') }}"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        </li>
        <li class="{% if active == 'add_product' %}active{% endif %}">
            <a href="{{ url_for('add_product') }}"><i class="fa-solid fa-plus"></i> Add Product</a>
        </li>
        <li class="{% if active == 'products' %}active{% endif %}">
            <a href="{{ url_for('admin_products') }}"><i class="fa-solid fa-box"></i> Products</a>
        </li>
        <li class="{% if active == 'orders' %}active{% endif %}">
            <a href="{{ url_for('admin_orders') }}"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
        </li>
        <li class="{% if active == 'customers' %}active{% endif %}">
            <a href="{{ url_for('admin_customers') }}"><i class="fa-solid fa-users"></i> Customers</a>
        </li>
        <li>
            <a href="/home"><i class="fa-solid fa-house"></i> Go to Website</a>
        </li>
    </ul>

</div>

<div class="content">

    <div class="topbar">

        <div style="display: flex; align-items: center; gap: 15px;">
            <button id="sidebar-toggle" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: none;">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h1>Welcome Back 👋</h1>
        </div>

        <button class="profile" onclick="window.location.href='{{ url_for('admin') }}'">
            Admin
        </button>

    </div>

    <div class="cards">

        <div class="card">
            <h2>{{ total_products }}</h2>
            <p>Total Products</p>
        </div>

        <div class="card">
            <h2>{{ total_customers }}</h2>
            <p>Customers</p>
        </div>

        <div class="card">
            <h2>{{ total_orders }}</h2>
            <p>Orders</p>
        </div>

        <div class="card">
            <h2>{{ revenue }}</h2>
            <p>Revenue</p>
        </div>

    </div>

</div>

<script>
    (function() {
        const sidebar = document.querySelector('.sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        const closeBtn = document.getElementById('sidebar-close');

        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.add('mobile-show');
            });
        }

        if (closeBtn && sidebar) {
            closeBtn.addEventListener('click', () => {
                sidebar.classList.remove('mobile-show');
            });
        }

        // Close sidebar on background click
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 900) {
                if (sidebar && toggleBtn && !sidebar.contains(e.target) && !toggleBtn.contains(e.target) && sidebar.classList.contains('mobile-show')) {
                    sidebar.classList.remove('mobile-show');
                }
            }
        });
    })();
</script>

</body>
</html>
